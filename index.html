*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--surface:#f6f6f6;--border:#e6e6e6;--border-dk:#c8c8c8;--text:#111;--muted:#999;--green:#15803d}
body{background:var(--bg);color:var(--text);font-family:'Geist','Helvetica Neue',sans-serif;min-height:100vh;overflow-x:hidden}
header{padding:18px 44px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(14px);z-index:20}
.logo{display:flex;align-items:center;gap:7px}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite;flex-shrink:0}

.ltitle{font-size:14px;font-weight:500;letter-spacing:-.3px}
.hright{display:flex;align-items:center;gap:12px}

.ts{font-size:10px;color:var(--muted);font-family:'Geist Mono',monospace}
main{padding:40px 44px 80px}
.ptitle{font-size:clamp(22px,3.5vw,36px);font-weight:300;letter-spacing:-1.4px;margin-bottom:4px}
.psub{font-size:12px;color:var(--muted);margin-bottom:40px}
.tabs{display:flex;border:1px solid var(--border);border-radius:7px;width:fit-content;margin-bottom:24px;overflow:hidden;flex-wrap:wrap}
.tab{padding:7px 15px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all .13s;border-right:1px solid var(--border);font-family:'Geist',sans-serif;white-space:nowrap}
.tab:last-child{border-right:none}
.tab:hover{color:var(--text);background:var(--surface)}
.tab.active{background:var(--text);color:#fff}
.ctrls{display:flex;gap:9px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.swrap{position:relative;flex:1;max-width:270px}
.swrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sinput{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 11px 8px 32px;font-size:12px;color:var(--text);font-family:'Geist',sans-serif;outline:none;transition:border .13s}
.sinput::placeholder{color:var(--muted)}
.sinput:focus{border-color:var(--border-dk)}
.clabel{font-size:11px;color:var(--muted);font-family:'Geist Mono',monospace;margin-left:auto}
.sbar{display:flex;gap:32px;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:22px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.sv{font-size:17px;font-weight:300;letter-spacing:-.4px}
.sl{font-size:10px;color:var(--muted);font-family:'Geist Mono',monospace;text-transform:uppercase;letter-spacing:.7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:1px;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--border)}
.card{background:var(--bg);padding:16px 18px;cursor:pointer;transition:background .12s;animation:fadeUp .3s ease both}

.card:hover{background:var(--surface)}
.ctop{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.av{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:-.1px}
.av img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.cinfo{flex:1;min-width:0}
.cname{font-size:13px;font-weight:500;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctag{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cworth{font-size:21px;font-weight:300;letter-spacing:-.7px;margin-bottom:9px}
.cur{font-size:12px;color:var(--muted);font-weight:400;margin-right:1px}

.csrc{font-size:9px;color:var(--muted);font-family:'Geist Mono',monospace}
.rbadge{font-size:9px;font-family:'Geist Mono',monospace;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:1px 5px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);background:var(--bg);font-size:13px}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.16);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .18s;backdrop-filter:blur(7px)}

.mhdr{display:flex;align-items:flex-start;gap:14px;padding:20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);border-radius:14px 14px 0 0;z-index:1}

.mtblock{flex:1;min-width:0}
.mname{font-size:16px;font-weight:500;letter-spacing:-.3px}
.mtag{font-size:11px;color:var(--muted);margin-top:2px}
.mwrow{display:flex;align-items:baseline;gap:8px;margin-top:5px}

.mclose:hover{background:var(--surface);color:var(--text)}
.mbody{padding:20px;display:flex;flex-direction:column;gap:20px}
.slabel{font-size:9px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-family:'Geist Mono',monospace;margin-bottom:9px}
.biotext{font-size:13px;font-weight:300;line-height:1.72;color:var(--text)}
.bars{display:flex;flex-direction:column;gap:9px}
.brow{display:flex;flex-direction:column;gap:4px}
.blabel{display:flex;justify-content:space-between;font-size:11px}
.blabel span:last-child{color:var(--muted);font-family:'Geist Mono',monospace}
.btrack{height:3px;background:var(--surface);border-radius:2px;overflow:hidden}
.bfill{height:100%;background:var(--text);border-radius:2px;width:0;transition:width 1.1s cubic-bezier(.16,1,.3,1)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fbox{background:var(--surface);border-radius:7px;padding:10px 12px;border:1px solid var(--border)}

@media(max-width:580px){header,main{padding:16px}grid{grid-template-columns:1fr}.sbar{gap:16px}.fgrid{grid-template-columns:1fr}.mbody{padding:16px}}
</style>
</head>

// ════════════════════════════════════════════════════════════════
// STATE & UTILS
// ════════════════════════════════════════════════════════════════
let cat="all",q="",list=[];
const fw=(w,u)=>`<span class="cur">$</span>${w}${u}`;
const toUSD=(w,u)=>u==="B"?w*1e9:w*1e6;
const fmtBig=n=>n>=1e12?`$${(n/1e12).toFixed(1)}T`:n>=1e9?`$${(n/1e9).toFixed(1)}B`:`$${(n/1e6).toFixed(0)}M`;
const ini=n=>n.split(" ").slice(0,2).map(s=>s[0]).join("").toUpperCase();

// Wikipedia photo cache
const pcache={};
async function photo(wiki){
  if(!wiki)return null;
  if(pcache[wiki]!==undefined)return pcache[wiki];
  try{
    const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wiki)}`);
    const d=await r.json();
    pcache[wiki]=d.thumbnail?.source||null;
  }catch{pcache[wiki]=null;}
  return pcache[wiki];
}

function setImg(el,url,name){
  const img=document.createElement("img");
  img.alt=name;
  img.src=url;
  img.onerror=()=>{img.remove();el.textContent=ini(name);};
  el.textContent="";
  el.appendChild(img);
}

// ════════════════════════════════════════════════════════════════
// RENDER GRID
// ════════════════════════════════════════════════════════════════
function render(){
  const grid=document.getElementById("grid");
  list=cat==="all"?P:P.filter(p=>p.cat===cat);
  if(q)list=list.filter(p=>p.n.toLowerCase().includes(q.toLowerCase())||p.tag.toLowerCase().includes(q.toLowerCase()));

  if(!list.length){grid.innerHTML=`<div class="empty">No results for "${q}"</div>`;updateStats([]);return;}

  grid.innerHTML=list.map((p,i)=>`
    <div class="card" data-i="${i}" style="animation-delay:${Math.min(i*25,600)}ms">
      <div class="ctop">
        <div class="av" id="av${i}">${ini(p.n)}</div>
        <div class="cinfo"><div class="cname">${p.n}</div><div class="ctag">${p.tag}</div></div>
      </div>
      <div class="cworth">${fw(p.w,p.u)}</div>
      <div class="cfoot"><span class="csrc">${p.src}</span><span class="rbadge">${p.rank}</span></div>
    </div>`).join("");

  updateStats(list);

  list.forEach((p,i)=>{
    if(!p.wiki)return;
    photo(p.wiki).then(url=>{
      if(!url)return;
      const el=document.getElementById(`av${i}`);
      if(el)setImg(el,url,p.n);
    });
  });

  grid.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openModal(list[+c.dataset.i])));
}

function updateStats(arr){
  const tot=arr.reduce((s,p)=>s+toUSD(p.w,p.u),0);
  const top=arr.length?[...arr].sort((a,b)=>toUSD(b.w,b.u)-toUSD(a.w,a.u))[0]:null;
  document.getElementById("stot").textContent=arr.length?fmtBig(tot):"—";
  document.getElementById("scnt").textContent=arr.length||"—";
  document.getElementById("stop").textContent=top?`${top.n.split(" ")[0]}`:"-";
  document.getElementById("savg").textContent=arr.length?fmtBig(tot/arr.length):"—";
  document.getElementById("cl").textContent=`${arr.length} people`;
}

// ════════════════════════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════════════════════════
async function openModal(p){
  const ov=document.getElementById("ov");
  const mhdr=document.getElementById("mhdr");
  const mbody=document.getElementById("mbody");

  // Build avatar
  const url=p.wiki?(pcache[p.wiki]!==undefined?pcache[p.wiki]:await photo(p.wiki)):null;

  mhdr.innerHTML=`
    <div class="mav" id="mav">${ini(p.n)}</div>
    <div class="mtblock">
      <div class="mname">${p.n}</div>
      <div class="mtag">${p.tag}</div>
      <div class="mwrow"><div class="mworth">${fw(p.w,p.u)}</div><span class="msrc">${p.src}</span></div>
    </div>
    <button class="mclose" id="mcls">✕</button>`;

  document.getElementById("mcls").onclick=closeModal;

  if(url){
    const mav=document.getElementById("mav");
    if(mav)setImg(mav,url,p.n);
  }

  // Build body
  const maxPct=p.ws&&p.ws.length?Math.max(...p.ws.map(s=>s.p)):1;

  mbody.innerHTML=`
    ${p.bio?`<div><div class="slabel">Biography</div><div class="biotext">${p.bio}</div></div>`:""}
    ${p.ws&&p.ws.length?`<div><div class="slabel">Wealth Breakdown</div><div class="bars">
      ${p.ws.map(s=>`<div class="brow">
        <div class="blabel"><span>${s.l}</span><span>${s.p}%</span></div>
        <div class="btrack"><div class="bfill" style="width:0%" data-p="${(s.p/maxPct)*100}"></div></div>
      </div>`).join("")}
    </div></div>`:""}
    ${p.facts&&p.facts.length?`<div><div class="slabel">Quick Facts</div><div class="fgrid">
      ${p.facts.map(f=>`<div class="fbox"><div class="fval">${f.v}</div><div class="fkey">${f.k}</div></div>`).join("")}
    </div></div>`:""}
    ${p.q?`<div><div class="slabel">Famous Quote</div><div class="qblock">"${p.q}"</div></div>`:""}`;

  ov.classList.add("open");
  document.body.style.overflow="hidden";

  // Animate bars
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      mbody.querySelectorAll(".bfill").forEach(el=>{el.style.width=el.dataset.p+"%";});
    });
  });
}

function closeModal(){
  document.getElementById("ov").classList.remove("open");
  document.body.style.overflow="";
}
document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

// ════════════════════════════════════════════════════════════════
// EVENTS
// ════════════════════════════════════════════════════════════════
document.getElementById("tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  cat=t.dataset.cat;q="";
  document.getElementById("si").value="";
  render();
});
document.getElementById("si").addEventListener("input",e=>{q=e.target.value.trim();render();});
setInterval(()=>{document.getElementById("ts").textContent=new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});},1000);
document.getElementById("ts").textContent=new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
render();
</script>
